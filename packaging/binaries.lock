# Third-party binaries bundled into release builds. packaging/fetch_binaries.py reads this file.
# Only binaries bundled at build time go here. The app can't read this file, so anything it
# downloads at run time, like Deno, is pinned in the app's own data.
# Each table is [<component>.<os>-<arch>], with os in windows, macos, linux and arch in x64, arm64.
# sha256 is the hash of the downloaded archive. archive_member is the binary's path inside it.

# sc-mp3's own ffmpeg: FFmpeg with LAME, built by .github/workflows/ffmpeg.yml from the source
# tarballs and build.sh that the same release holds. Each zip also holds a README and the license
# texts, which packaging/bundle_licenses.py copies next to the app.
[ffmpeg.windows-x64]
url = "https://github.com/rajansavani/sc-mp3/releases/download/ffmpeg-9.0.2-1/ffmpeg-9.0.2-sc-mp3-windows-x64.zip"
sha256 = "26c0727c28fe66b183b1583ba40f131eda988d6a01cafadbdaf78d479fb6744e"
archive_member = "ffmpeg.exe"
version = "9.0.2"
license = "LGPL-2.1-or-later"
source_url = "https://github.com/rajansavani/sc-mp3/releases/tag/ffmpeg-9.0.2-1"

[ffmpeg.macos-arm64]
