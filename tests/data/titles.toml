# The title corpus for the suggestion engine (core/suggest). Every case says what it checks.
#
# Input: `title`, `uploader`, and optionally the publisher `artists` and `settings` changes.
# `kind = "youtube"` makes the source a YouTube video, whose `artists` are YouTube Music's.
# `kind = "file"` makes it a file to re-tag, at `path`. A `description` is the track's.
# Expected:
# - `base_title`, `main`, `featured` and `version` ("" for none) of the suggestion
# - `on` and `off`: the ids of the changes that start on and those offered switched off, in order.
#   An id is "kind:span", with "#2" added when the same change appears twice.
# - `artist_field`, `feat_in_title`, `all_in_title`: the [title, artist] each preset renders
# - `[[case.toggle]]`: switching the `off` ids off and the `on` ids on renders each preset as given
# - `all_off`, only for messy titles like "Kaia -": the title with every change off, once tidied
#
# tests/unit/test_suggest_corpus.py also checks every case for these, with no extra data:
# - turning each change off puts its exact text back, once, in every preset
# - with every change off, the title is the original with only whitespace and dashes normalized
# - suggesting again from the result records no change that starts on, and renders the same

[[case]]
checks = "ft inside a word, as in Left, is not a feature keyword"
title = "Left Behind"
uploader = "Some Artist"
base_title = "Left Behind"
main = ["Some Artist"]
featured = []
version = ""
on = []
artist_field = ["Left Behind", "Some Artist"]
feat_in_title = ["Left Behind", "Some Artist"]
all_in_title = ["Left Behind (Some Artist)", "Some Artist"]

