<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Only the app's own files run. The hash allows the import map below, the one inline script.
     frame-ancestors is left out, because browsers ignore it in a meta tag and log an error. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-B4UuEjW28Kca+wJC+FujYZJaWaC9jVXJDOVw3NIv+Qg='; img-src 'self' data: https:; object-src 'none'; base-uri 'none'">
<title>sc-mp3</title>
<!-- An empty icon, so the browser doesn't ask the server for a favicon.ico that isn't there. -->
<link rel="icon" href="data:,">
<!-- The vendored modules import each other by their npm names, which this maps to files. -->
<script type="importmap">
{
  "imports": {
    "preact": "./vendor/preact.module.js",
    "preact/hooks": "./vendor/hooks.module.js",
    "htm": "./vendor/htm.module.js",
    "htm/preact": "./vendor/htm-preact.module.js"
  }
}
</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/app.css">
<link rel="stylesheet" href="styles/controls.css">
<!-- One stylesheet per component, so each UI ticket edits only its own. -->
<link rel="stylesheet" href="styles/TopBar.css">
<link rel="stylesheet" href="styles/Queue.css">
<link rel="stylesheet" href="styles/TrackEditor.css">
<link rel="stylesheet" href="styles/EditorStates.css">
<link rel="stylesheet" href="styles/CoverPanel.css">
<link rel="stylesheet" href="styles/SetEditor.css">
<link rel="stylesheet" href="styles/settings-fields.css">
<link rel="stylesheet" href="styles/Settings.css">
<link rel="stylesheet" href="styles/FirstRun.css">
<link rel="stylesheet" href="styles/SignInDialog.css">
<link rel="stylesheet" href="styles/SpotifyHelp.css">
<link rel="stylesheet" href="styles/Toasts.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div id="app"></div>
</body>
</html>
