name: Release

on:
  push:
    tags: ["v*"]
  # A dry run from any branch: it builds and smoke-tests every zip, but drafts no release.
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned by commit, with its tag in a comment. Any action in the run could replace
# an artifact before the release job attaches it, so a moved tag anywhere could change a release.

env:
  # The ffmpeg release that packaging/binaries.lock's builds come from. Each app release attaches
  # the bundled ffmpeg's complete source from it, which the Windows job collects.
  FFMPEG_RELEASE_URL: https://github.com/rajansavani/sc-mp3/releases/tag/ffmpeg-9.0.2-1

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.version.outputs.app }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token doesn't need to stay in .git/config.
          persist-credentials: false

      - name: Read the app's version, and check the tag against it
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          app="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          prerelease=false
          # A dry run has no tag to check.
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            # A test tag like v0.1.0-rc1 builds the app's own version, 0.1.0.
            if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc[0-9]+)?$ ]]; then
              echo "::error::The tag $tag isn't vX.Y.Z or vX.Y.Z-rcN."
              exit 1
            fi
            if [ "${BASH_REMATCH[1]}" != "$app" ]; then
              echo "::error::The tag $tag doesn't match the version in pyproject.toml, $app."
              exit 1
            fi
            if [ -n "${BASH_REMATCH[2]}" ]; then prerelease=true; fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  windows:
    name: Build for Windows
    needs: version
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      APP_VERSION: ${{ needs.version.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match the dev machine's uv, since setup-uv would otherwise pick the newest one that fits required-version.
          version: "0.8.22"

      - run: uv sync --locked

      - name: Fetch the binaries
        run: uv run --locked python packaging/fetch_binaries.py --os windows --arch x64

      - name: Build
        run: uv run --locked python packaging/build.py

      - name: Smoke-test the zipped app
        run: |
          $zip = "dist/sc-mp3-$env:APP_VERSION-windows-x64.zip"
          $unzipped = Join-Path $env:RUNNER_TEMP "smoke"
          Expand-Archive -Path $zip -DestinationPath $unzipped
          $printed = Join-Path $env:RUNNER_TEMP "version.txt"
          # The exe is windowed, so wait on the process for its exit code; & exe wouldn't wait.
          $app = Start-Process -FilePath (Join-Path $unzipped "sc-mp3/sc-mp3.exe") -ArgumentList "--version" -RedirectStandardOutput $printed -Wait -PassThru
          # An empty file reads as null, so turn it into a string before trimming.
          $output = "$(Get-Content -Raw $printed)".Trim()
          if ($app.ExitCode -ne 0 -or $output -ne $env:APP_VERSION) {
            Write-Output "::error::sc-mp3.exe --version exited with $($app.ExitCode) and printed '$output'."
            exit 1
          }

      # Our ffmpeg has no lavfi, so the check writes a WAV tone with Python and converts that.
      - name: Check that the zipped app's ffmpeg makes both kinds of MP3
        run: |
          $ffmpeg = Join-Path $env:RUNNER_TEMP "smoke/sc-mp3/_internal/ffmpeg.exe"
          uv run --locked python packaging/ffmpeg/check_bundled.py --ffmpeg $ffmpeg --out (Join-Path $env:RUNNER_TEMP "ffmpeg-check")
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::The bundled ffmpeg failed its checks. The table above says which."
            exit 1
          }

      - name: Collect the release files
        run: |
          $release = New-Item -ItemType Directory -Path release
          # build.py writes the checksum in sha256sum's format, which is what SHA256SUMS holds.
          Copy-Item "dist/sc-mp3-$env:APP_VERSION-windows-x64.zip*" $release
          # The bundled ffmpeg's complete source: FFmpeg's and LAME's tarballs, and the script that
          # built ffmpeg from them. Each SHA-256 is the one in the ffmpeg release's SHA256SUMS.
          $sources = [ordered]@{
            "ffmpeg-9.0.2.tar.xz" = "8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e"
            "lame-4.0.tar.gz" = "3df5124d5ad3a98312ffd7ba6a9b36230e4f8a3e66d3ce0f425e336c32d216eb"
            "build.sh" = "1bfb8f5cd8b3de77275d7345551cd4842df9fdadd138bb79c8f5e0bce130a03a"
          }
          $download = $env:FFMPEG_RELEASE_URL.Replace("/releases/tag/", "/releases/download/")
          foreach ($name in $sources.Keys) {
            $file = Join-Path $release $name
            # A download from ffmpeg.org once lost its connection, so curl retries before giving up.
            # Under 1 KB/s for a minute counts as a failure too, so a stalled download is retried.
            curl.exe --fail --location --silent --show-error --connect-timeout 30 --speed-limit 1000 --speed-time 60 --retry 5 --retry-all-errors --retry-delay 10 --output $file "$download/$name"
            if ($LASTEXITCODE -ne 0) {
              Write-Output "::error::Couldn't download $name from $download."
              exit 1
            }
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            if ($hash -ne $sources[$name]) {
              Write-Output "::error::$name has SHA-256 $hash, not the pinned $($sources[$name])."
              exit 1
            }
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: release/
          if-no-files-found: error

  macos:
    name: Build for macOS (${{ matrix.arch }})
    needs: version
    strategy:
      # Let both Macs finish, so one failure doesn't hide the other.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            machine: arm64
          # The last Intel image, available until August 2027.
          - runner: macos-15-intel
            arch: x64
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ needs.version.outputs.app }}
      TARGET: macos-${{ matrix.arch }}
      MACHINE: ${{ matrix.machine }}
      # uv's own Python runs on older macOS versions than the runner's Homebrew Python does.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.22"

      - run: uv sync --locked

      - name: Fetch the binaries
        run: uv run --locked python packaging/fetch_binaries.py --os macos --arch ${{ matrix.arch }}

      - name: Build
        run: uv run --locked python packaging/build.py

      - name: Smoke-test the zipped app
        run: |
          unzipped="$RUNNER_TEMP/smoke"
          # ditto unzips the way Finder does, keeping the links that the app's signature covers.
          ditto -x -k "dist/sc-mp3-$APP_VERSION-$TARGET.zip" "$unzipped"
          app="$unzipped/sc-mp3/sc-mp3.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for binary in MacOS/sc-mp3 Frameworks/ffmpeg; do
            archs="$(lipo -archs "$app/Contents/$binary")"
            if [ "$archs" != "$MACHINE" ]; then
              echo "::error::$binary is built for $archs, not $MACHINE."
              exit 1
            fi
          done
          printed="$("$app/Contents/MacOS/sc-mp3" --version)" || status=$?
          if [ "${status:-0}" -ne 0 ] || [ "$printed" != "$APP_VERSION" ]; then
            echo "::error::sc-mp3 --version exited with ${status:-0} and printed '$printed'."
            exit 1
          fi
          echo "SMOKE_APP=$app" >> "$GITHUB_ENV"

      # Our ffmpeg has no lavfi, so the check writes a WAV tone with Python and converts that.
      - name: Check that the zipped app's ffmpeg makes both kinds of MP3
        run: |
          if ! uv run --locked python packaging/ffmpeg/check_bundled.py --ffmpeg "$SMOKE_APP/Contents/Frameworks/ffmpeg" --out "$RUNNER_TEMP/ffmpeg-check"; then
            echo "::error::The bundled ffmpeg failed its checks. The table above says which."
            exit 1
          fi

      - name: Open the app and check that it shows the UI
        run: |
          home="$RUNNER_TEMP/home"
          smoke="$RUNNER_TEMP/smoke-results"
          log="$home/logs/sc-mp3.log"
          mkdir -p "$home/config" "$smoke"
          # No update checks, so the run makes no downloads.
          echo '{"check_engine_updates": false, "check_app_updates": false}' > "$home/config/settings.json"
          # pywebview's own debug lines go into the app's log too.
          SCMP3_HOME="$home" PYWEBVIEW_LOG=debug "$SMOKE_APP/Contents/MacOS/sc-mp3" > "$smoke/output.txt" 2>&1 &
          pid=$!
          # One screenshot while the page loads, and one once it should have loaded on a slow runner.
          sleep 10
          screencapture -x "$smoke/after-10-s.png" || echo "::warning::Couldn't take a screenshot."
          sleep 20
          screencapture -x "$smoke/after-30-s.png" || echo "::warning::Couldn't take a screenshot."
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            wait "$pid" || true
          else
            wait "$pid" && status=0 || status=$?
            echo "::error::The app closed by itself with exit code $status."
          fi
          cp -R "$home/logs" "$smoke/" || true
          cat "$smoke/output.txt"
          if [ -n "${status:-}" ]; then exit 1; fi
          # The app logs this once its page has loaded and the UI's scripts have run.
          if ! grep -q "The window shows the UI" "$log"; then
            echo "::error::The app's window didn't show the UI within 30 s."
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke-results/
          if-no-files-found: warn

      - name: Collect the release files
        run: |
          mkdir release
          # build.py writes the checksum in sha256sum's format, which is what SHA256SUMS holds.
          cp "dist/sc-mp3-$APP_VERSION-$TARGET.zip" "dist/sc-mp3-$APP_VERSION-$TARGET.zip.sha256" release/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.TARGET }}
          path: release/
          if-no-files-found: error

  release:
    name: Draft the release
    needs: [version, windows, macos]
    # A dry run stops at the builds, whose zips stay downloadable from the run's page.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Only this job, which runs no project code, can write releases.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create a draft release
        working-directory: release
        env:
          APP_VERSION: ${{ needs.version.outputs.app }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          zips=(sc-mp3-*.zip)
          if [ "${#zips[@]}" -ne 3 ]; then
            echo "::error::Expected the Windows zip and both Mac zips, but found: ${zips[*]}."
            exit 1
          fi
          # The Windows job collected these from the ffmpeg release and checked each SHA-256.
          sources=(ffmpeg-*.tar.xz lame-*.tar.gz build.sh)
          for file in "${sources[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::The Windows job's files have no $file, which is part of ffmpeg's source."
              exit 1
            fi
          done
          cat sc-mp3-*.zip.sha256 > SHA256SUMS
          prefix="sc-mp3-${APP_VERSION}"
          cat > notes.md <<EOF
          Windows: download ${prefix}-windows-x64.zip, extract it, and open sc-mp3.exe in the extracted folder. The first time, Windows shows "Windows protected your PC". Select More info, then Run anyway.

          Mac, with macOS 12 or later: download ${prefix}-macos-arm64.zip for a Mac with Apple silicon (M1 or later), or ${prefix}-macos-x64.zip for a Mac with an Intel processor. Double-click the zip, then drag sc-mp3.app from the sc-mp3 folder to Applications. The first time, macOS says it couldn't verify sc-mp3. The README says how to open it.

          The README explains setup and how to add your songs to Spotify. SHA256SUMS holds the zips' SHA-256 checksums.

          The app bundles an ffmpeg that sc-mp3 builds from FFmpeg and LAME, under the LGPL version 2.1 or later. Its source is attached: ${sources[0]} is FFmpeg's, ${sources[1]} is LAME's, and ${sources[2]} is the script that built ffmpeg from them. They come from ${FFMPEG_RELEASE_URL}, which says how to rebuild it.
          EOF
          options=(--draft --verify-tag --repo "$GITHUB_REPOSITORY" --title "sc-mp3 ${GITHUB_REF_NAME#v}" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${zips[@]}" SHA256SUMS "${sources[@]}" "${options[@]}"
